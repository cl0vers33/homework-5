<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健身记录</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 600px; margin: 24px auto; padding: 0 16px; }
    h1 { color: #2e7d32; }
    form { background: #f5f5f5; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    form .row { margin-bottom: 10px; }
    label { display: inline-block; width: 80px; }
    input, select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 6px 16px; background: #4caf50; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #43a047; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; margin: 8px 0; }
    .filters { margin: 12px 0; }
    .filters input { width: 60%; }
    .record { border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 6px; list-style: none; }
    .record-head { display: flex; align-items: center; gap: 12px; }
    .type { background: #e3f2fd; color: #1565c0; padding: 2px 10px; border-radius: 10px; font-size: 13px; }
    .date { color: #666; font-size: 14px; }
    .duration { color: #2e7d32; font-size: 14px; }
    .notes { color: #555; font-size: 14px; margin-top: 6px; }
    .del { margin-left: auto; color: #c00; cursor: pointer; font-size: 14px; }
    .del:hover { text-decoration: underline; }
    .empty { color: #999; list-style: none; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>健身记录</h1>
  <form id="add-form">
    <div class="row">
      <label>日期</label>
      <input type="date" id="date-input">
    </div>
    <div class="row">
      <label>运动类型</label>
      <select id="type-input">
        <option value="">请选择</option>
        <option value="跑步">跑步</option>
        <option value="力量训练">力量训练</option>
        <option value="瑜伽">瑜伽</option>
        <option value="游泳">游泳</option>
        <option value="骑行">骑行</option>
        <option value="球类">球类</option>
      </select>
    </div>
    <div class="row">
      <label>时长(分钟)</label>
      <input type="number" id="duration-input" min="1">
    </div>
    <div class="row">
      <label>备注</label>
      <input type="text" id="notes-input" placeholder="可选">
    </div>
    <button type="submit">添加记录</button>
  </form>
  <p class="tip" id="tip"></p>
  <div class="filters">
    <input type="text" id="search-input" placeholder="按类型或备注搜索">
  </div>
  <ul id="record-list"></ul>
  <script src="app.js"></script>
</body>
</html>
